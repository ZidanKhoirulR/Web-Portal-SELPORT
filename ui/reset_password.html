<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Portal BBSPJIS</title>
    <link rel="icon" type="image/png" href="{{ @BASE }}/public/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #62A0FD;
            --primary-dark: #2C7BE5;
            --error: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #EEF4FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-form-wrapper {
            max-width: 400px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .form-header p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .alert {
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .required {
            color: var(--primary-color);
        }

        .password-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(98, 160, 253, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(98, 160, 253, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(98, 160, 253, 0.35);
        }

        /* Password Requirements Styling */
        .password-requirements {
            text-align: left;
            margin-top: 15px;
            width: 100%;
            background-color: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 12px;
            border-radius: 10px;
        }

        .password-requirements p {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .password-requirements ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .password-requirements li {
            font-size: 0.7rem;
            color: var(--primary-color);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s ease;
        }

        .password-requirements li::before {
            content: "•";
            font-weight: bold;
        }

        .password-requirements li.valid {
            color: var(--text-primary);
        }

        /* Password Match Indicator */
        .password-match-indicator {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            margin-bottom: 4px;
            width: 100%;
        }

        .match-bar {
            height: 4px;
            flex: 1;
            background-color: #e2e8f0;
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }

        .match-bar.red {
            background-color: var(--error);
        }

        .match-bar.yellow {
            background-color: var(--warning);
        }

        .match-bar.green {
            background-color: var(--success);
        }

        .match-message {
            font-size: 0.7rem;
            margin-top: 4px;
            text-align: left;
            width: 100%;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .match-message.red {
            color: var(--error);
        }

        .match-message.yellow {
            color: var(--warning);
        }

        .match-message.green {
            color: var(--success);
        }
    </style>
</head>

<body>
    <div class="reset-form-wrapper">
        <div class="form-header">
            <h1>Reset Password</h1>
            <p>Buat password baru untuk akun Anda</p>
        </div>

        <F3:check if="{{ @error }}">
            <div class="alert alert-error">{{ @error }}</div>
        </F3:check>

        <F3:check if="{{ @token }}">
            <form method="POST" action="{{ @BASE }}/reset-password" id="resetPasswordForm">
                <input type="hidden" name="token" value="{{ @token }}">

                <div class="form-group">
                    <label for="password">Password Baru <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Masukkan password baru"
                            required autofocus>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>

                    <div class="password-requirements">
                        <p>Password harus memiliki:</p>
                        <ul>
                            <li id="req-length">Min 8 karakter</li>
                            <li id="req-uppercase">Huruf kapital (A-Z)</li>
                            <li id="req-number">Angka (0-9)</li>
                            <li id="req-special">Simbol (!@#$)</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password_confirmation">Konfirmasi Password <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password_confirmation" name="password_confirmation"
                            placeholder="Ulangi password baru" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password_confirmation')">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="password-match-indicator">
                        <div class="match-bar" id="match-bar-1"></div>
                        <div class="match-bar" id="match-bar-2"></div>
                        <div class="match-bar" id="match-bar-3"></div>
                    </div>
                    <div class="match-message" id="match-message"></div>
                </div>

                <button type="submit" class="btn-submit">Simpan Password</button>
            </form>
        </F3:check>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            const icon = button.querySelector('.eye-icon');

            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            }
        }

        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('password_confirmation');

        if (passwordInput) {
            passwordInput.addEventListener('input', validatePassword);
        }
        if (confirmPasswordInput) {
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
        }

        function validatePassword() {
            const password = passwordInput.value;

            // Length
            const lengthReq = document.getElementById('req-length');
            lengthReq.classList.toggle('valid', password.length >= 8);

            // Uppercase
            const uppercaseReq = document.getElementById('req-uppercase');
            uppercaseReq.classList.toggle('valid', /[A-Z]/.test(password));

            // Number
            const numberReq = document.getElementById('req-number');
            numberReq.classList.toggle('valid', /[0-9]/.test(password));

            // Special
            const specialReq = document.getElementById('req-special');
            specialReq.classList.toggle('valid', /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password));

            checkPasswordMatch();
        }

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!confirmPassword) {
                resetMatchBars();
                return;
            }

            const bar1 = document.getElementById('match-bar-1');
            const bar2 = document.getElementById('match-bar-2');
            const bar3 = document.getElementById('match-bar-3');
            const message = document.getElementById('match-message');

            if (password === confirmPassword && password.length > 0) {
                setMatchState('green', '✓ Kata sandi cocok');
            } else if (password.startsWith(confirmPassword) || confirmPassword.startsWith(password)) {
                setMatchState('yellow', '⚠ Kata sandi agak cocok', true);
            } else {
                setMatchState('red', '✗ Kata sandi tidak cocok', false, true);
            }
        }

        function setMatchState(color, text, partial = false, none = false) {
            const bar1 = document.getElementById('match-bar-1');
            const bar2 = document.getElementById('match-bar-2');
            const bar3 = document.getElementById('match-bar-3');
            const message = document.getElementById('match-message');

            message.textContent = text;
            message.className = 'match-message ' + color;

            if (color === 'green') {
                bar1.className = bar2.className = bar3.className = 'match-bar green';
            } else if (partial) {
                bar1.className = bar2.className = 'match-bar yellow';
                bar3.className = 'match-bar';
            } else {
                bar1.className = 'match-bar red';
                bar2.className = bar3.className = 'match-bar';
            }
        }

        function resetMatchBars() {
            document.getElementById('match-bar-1').className = 'match-bar';
            document.getElementById('match-bar-2').className = 'match-bar';
            document.getElementById('match-bar-3').className = 'match-bar';
            document.getElementById('match-message').textContent = '';
        }
    </script>
</body>

</html>
