<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELPORT - Keuangan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ @BASE }}/public/css/keuangan/dashboard.css?v={{ time() }}">

    <link rel="icon" type="image/x-icon" href="{{ @BASE }}/public/favicon.ico">

    <script>
        const BASE_URL = '{{ @BASE }}';
        const SECTION = '{{ @SECTION }}';
        const KEU_AVATAR = '{{ @SESSION.nama_avatar }}';
        const KEU_NAME = '{{ @SESSION.nama_lengkap }}';
        const KEU_USERNAME = '{{ @SESSION.username }}';
        try { localStorage.setItem('selport_auth', JSON.stringify({ role: 'keuangan', base: BASE_URL })); } catch(e) {}
    </script>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="{{ @BASE }}/public/images/logo.png" alt="BBSPJIS Logo">
                </div>
            </div>

            <hr class="sidebar-divider my-0">

            <nav class="sidebar-nav">
                <div class="nav-separator">Dashboard</div>
                <a href="#" class="nav-item active" data-section="ringkasan">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>

                <hr class="sidebar-divider">
                <div class="nav-separator">Pembayaran</div>
                <a href="#" class="nav-item" data-section="kelola-pembayaran">
                    <i class="ri-bank-card-line"></i>
                    <span>Kelola Pembayaran</span>
                </a>
                <a href="#" class="nav-item" data-section="kesanggupan-pembayaran">
                    <i class="ri-file-text-line"></i>
                    <span>Kesanggupan Pembayaran</span>
                </a>


                <hr class="sidebar-divider d-none d-md-block">
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">
                    <i class="ri-menu-line"></i>
                </button>
                <div class="user-info">
                    <div class="profile-dropdown" id="profileDropdown">
                        <button class="profile-toggle" id="profileToggle">
                            <img src="{{ @BASE }}/public/avatar/{{ @SESSION.nama_avatar }}" alt="Avatar"
                                class="profile-avatar" onerror="this.src='{{ @BASE }}/public/avatar/avatar.png'">
                            <span class="profile-name">{{ @SESSION.nama_lengkap }}</span>
                            <i class="ri-arrow-down-s-line"></i>
                        </button>
                        <div class="profile-menu" id="profileMenu">
                            <a href="#" class="profile-menu-item" onclick="showEditProfileModal(); return false;">
                                <i class="ri-user-settings-line"></i> Edit Profil
                            </a>
                            <hr style="margin:4px 0; border-color:#e3e6f0;">
                            <a href="{{ @BASE }}/logout" class="profile-menu-item" style="color:#e74a3b;">
                                <i class="ri-logout-box-line"></i> Keluar
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-area" id="contentArea">
            </div>
        </main>
    </div>

    <div id="alertModal" class="modal">
        <div class="modal-content" style="max-width:380px; text-align:center;">
            <div id="alertModalIcon" style="font-size:2.5rem; margin-bottom:10px;">
                <i class="ri-checkbox-circle-line" style="color:#1cc88a;"></i>
            </div>
            <p id="alertModalMessage" style="margin-bottom:20px;color:#5a5c69;font-size:0.95rem;font-weight:500;"></p>
            <div class="modal-actions" style="justify-content:center;">
                <button class="btn btn-primary" onclick="closeKeuModal('alertModal')">OK</button>
            </div>
        </div>
    </div>

    <div id="confirmKeuModal" class="modal">
        <div class="modal-content" style="max-width:400px; text-align:center;">
            <h3 id="confirmKeuTitle" style="font-size:1.1rem; margin-bottom: 8px;"></h3>
            <p id="confirmKeuMessage" style="margin-bottom:20px;color:#5a5c69;font-size:0.9rem;"></p>
            <div class="form-group" id="confirmKeuReasonGroup" style="display:none; text-align:left;">
                <label style="font-weight:600; font-size:0.85rem;">Alasan Penolakan</label>
                <input type="text" id="confirmKeuReason" class="form-control" placeholder="Masukkan alasan...">
            </div>
            <div class="modal-actions" style="justify-content:center; margin-top:15px;">
                <button class="btn btn-secondary" onclick="closeKeuModal('confirmKeuModal')">Batal</button>
                <button class="btn btn-primary" id="confirmKeuOkBtn">Konfirmasi</button>
            </div>
        </div>
    </div>

    <div id="editProfileModal" class="modal">
        <div class="modal-content" style="max-width:480px;">
            <h3><i class="ri-user-settings-line"></i> Edit Profil</h3>
            <form id="editProfileForm" enctype="multipart/form-data">
                <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
                    <img id="editProfileAvatar" class="profile-avatar-large" src="" alt="Avatar"
                        onerror="this.src=BASE_URL+'/public/avatar/avatar.png'">
                    <div style="flex:1;">
                        <label class="btn btn-secondary"
                            style="cursor:pointer; font-size:0.8rem; display:inline-block;">
                            <i class="ri-camera-line"></i> Ganti Foto
                            <input type="file" name="avatar" id="editAvatarInput" accept="image/*"
                                style="display:none;">
                        </label>
                        <p style="font-size:0.75rem; color:#858796; margin-top:5px;">Format: JPG, PNG. Maks 2MB.</p>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" name="nama_lengkap" id="editNamaLengkap" class="form-control">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="editUsername" class="form-control" disabled style="background:#f8f9fc;">
                </div>
                <div class="form-group">
                    <label>Password Baru <small style="color:#858796;">(kosongkan jika tidak ingin
                            mengubah)</small></label>
                    <input type="password" name="password" id="editPassword" class="form-control"
                        placeholder="••••••••">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary"
                        onclick="closeKeuModal('editProfileModal')">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        /* ===== Session Expired Modal ===== */
        #sessionExpiredModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }
        .session-modal-content {
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.18);
            animation: sessionModalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes sessionModalIn {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .session-modal-icon {
            display: block;
            margin: 0 auto 24px;
            font-size: 3rem;
            line-height: 1;
        }
        .session-modal-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 10px;
        }
        .session-modal-message {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.6;
            margin: 0 0 32px;
        }
        .session-modal-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 13px 36px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .session-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }
        .session-modal-timer {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 16px;
        }
    </style>

    <!-- Session Expired Modal -->
    <div id="sessionExpiredModal">
        <div class="session-modal-content">
            <div class="session-modal-icon">⏱️</div>
            <h3 class="session-modal-title">Sesi Telah Berakhir</h3>
            <p class="session-modal-message">
                Anda tidak aktif selama 10 menit.<br>
                Silakan login ulang untuk melanjutkan.
            </p>
            <button class="session-modal-btn" onclick="SessionTimeout.redirect()">
                Login Ulang
            </button>
            <p class="session-modal-timer" id="sessionRedirectCountdown"></p>
        </div>
    </div>

    <script src="{{ @BASE }}/public/js/back-guard.js?v={{ time() }}"></script>
    <script src="{{ @BASE }}/public/js/session-timeout.js?v={{ time() }}"></script>
    <script src="{{ @BASE }}/public/js/keuangan.js?v={{ time() }}"></script>
</body>

</html>
