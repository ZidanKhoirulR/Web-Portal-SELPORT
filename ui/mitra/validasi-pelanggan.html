<div class="page-header" style="margin-bottom: 15px;">
    <h2>Validasi Pelanggan</h2>
</div>
<div class="card" style="margin-bottom: 20px; padding: 15px 20px; display: flex; flex-direction: row; justify-content: space-between; align-items: center; gap: 15px;">
    <input type="text" id="customerSearch" placeholder="Cari nama, email, perusahaan ..." class="form-control" style="width: 300px;">
        <div class="admin-custom-select" id="dropdown-statusFilter" style="width: 150px;">
            <button type="button" class="select-trigger">
                <span class="selected-text">Pending</span>
                <svg class="select-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="select-options">
                <div class="option selected" data-value="pending">Pending</div>
                <div class="option" data-value="active">Disetujui</div>
                <div class="option" data-value="rejected">Ditolak</div>
            </div>
            <input type="hidden" id="statusFilter" value="pending">
        </div>
</div>
<div class="card">
    <div class="table-responsive table-scroller">
        <table class="table" id="validasiTable">
            <thead>
                <tr>
                    <th>Tanggal Daftar</th>
                    <th>Nama Lengkap</th>
                    <th>Email</th>
                    <th>Kategori</th>
                    <th>Status</th>
                    <th>Dikelola Oleh</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div id="validasiPagination" class="pagination-container"></div>
</div>
